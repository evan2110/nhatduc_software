# Deploy mien phi: https://render.com -> New + Blueprint -> chon repo nay
services:
  - type: web
    name: nhatduc-software-web
    runtime: docker
    plan: free
    region: singapore
    branch: feature/ducdn
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: SUPABASE_DB_PASSWORD
        sync: false
