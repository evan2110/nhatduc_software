# Deploy mien phi: https://render.com -> New + Blueprint -> chon repo nay
services:
  - type: web
    name: nhatduc-software-web
    runtime: docker
    plan: free
    region: singapore
    branch: feature/ducdn
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: GOOGLE_DRIVE_ROOT_FOLDER_ID
        value: 1g1sl-pKk1d3sixMkpXbSWmiFDXb55u-n
      - key: GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_ID
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_DRIVE_REFRESH_TOKEN
        sync: false
